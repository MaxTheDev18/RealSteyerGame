<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steyer Clicker </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    overflow-x: hidden;
}

header {
    background: #181825;
    padding: 15px 20px;
    text-align: center;
    border-bottom: 2px solid #313244;
}

header h1 {
    margin: 0;
    color: #cba6f7;
    font-size: 28px;
}

.game {
    display: grid;
    grid-template-columns: 300px 1fr 330px;
    min-height: calc(100vh - 70px);
}

/* =========================
   LEFT PANEL
========================= */

.left-panel {
    background: #181825;
    border-right: 2px solid #313244;
    padding: 15px;
    overflow-y: auto;
}

.left-panel h2,
.right-panel h2 {
    color: #f5c2e7;
    margin-top: 0;
}

/* =========================
   UPGRADES
========================= */

.upgrade {
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.15s;
}

.upgrade:hover {
    background: #45475a;
    transform: scale(1.02);
}

.upgrade:active {
    transform: scale(0.98);
}

.upgrade-name {
    font-weight: bold;
    color: #cba6f7;
    margin-bottom: 4px;
}

.upgrade-info {
    font-size: 13px;
    color: #a6adc8;
}

.upgrade-cost {
    margin-top: 5px;
    color: #a6e3a1;
    font-weight: bold;
}

.upgrade-count {
    float: right;
    color: #f9e2af;
    font-weight: bold;
}

/* =========================
   CANNOT AFFORD
========================= */

.upgrade.cannot-afford {
    background: #24242f;
    border-color: #383846;
    opacity: 0.5;
}

.upgrade.cannot-afford .upgrade-name {
    color: #77798a;
}

.upgrade.cannot-afford .upgrade-info {
    color: #5f6170;
}

.upgrade.cannot-afford .upgrade-cost {
    color: #77798a;
}

.upgrade.cannot-afford .upgrade-count {
    color: #696b7a;
}

.upgrade.cannot-afford:hover {
    background: #292936;
    transform: none;
}

/* =========================
   CENTER PANEL
========================= */

.center-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
}

.stats {
    width: 100%;
    max-width: 700px;
    background: #181825;
    border: 2px solid #313244;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
}

.joules {
    font-size: 30px;
    color: #f9e2af;
    font-weight: bold;
}

.per-second {
    color: #a6e3a1;
    margin-top: 5px;
}

#clicker {
    width: 250px;
    height: 250px;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s;
}

#clicker:active {
    transform: scale(0.92);
}

.facilities-title {
    margin-top: 25px;
    color: #f5c2e7;
}

/* =========================
   FACILITIES
========================= */

#facilities {
    width: 100%;
    max-width: 1100px;
}

.facility-card {
    background: #181825;
    border: 2px solid #313244;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    min-height: 155px;

    display: flex;
    align-items: center;
    gap: 20px;
}

.facility-info {
    flex: 0 0 190px;
    min-width: 190px;
}

.facility-name {
    font-size: 17px;
    font-weight: bold;
    color: #cba6f7;
}

.facility-category {
    font-size: 12px;
    color: #9399b2;
    margin-top: 5px;
}

.facility-production {
    font-size: 13px;
    color: #a6e3a1;
    margin-top: 7px;
}

.facility-images {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    flex: 1;
}

/* =========================
   BIG UPGRADE IMAGES
========================= */

.facility-image {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid #45475a;
    background: #313244;
    flex-shrink: 0;
    transition: transform 0.12s;
}

.facility-image:hover {
    transform: scale(1.05);
}

.no-image {
    color: #6c7086;
    font-size: 13px;
    font-style: italic;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel {
    background: #181825;
    border-left: 2px solid #313244;
    padding: 15px;
    overflow-y: auto;
}

/* =========================
   SKINS
========================= */

.skin {
    width: 100%;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.15s;
    text-align: left;
}

.skin:hover {
    background: #45475a;
    transform: scale(1.02);
}

.skin:active {
    transform: scale(0.98);
}

.skin-name {
    font-weight: bold;
    color: #cba6f7;
    font-size: 16px;
}

.skin-cost {
    color: #a6e3a1;
    font-size: 13px;
    margin-top: 5px;
}

.skin-multiplier {
    color: #a6adc8;
    font-size: 13px;
    margin-top: 3px;
}

/* =========================
   LEADERBOARD
========================= */

.leaderboard {
    margin-top: 25px;
}

.leaderboard-entry {
    background: #313244;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

button {
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    background: #cba6f7;
    color: #1e1e2e;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.submit-button {
    margin-top: 8px;
}

.reset-button {
    margin-top: 20px;
    background: #f38ba8;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 1000px) {

    .game {
        grid-template-columns: 1fr;
    }

    .left-panel,
    .right-panel {
        border: none;
        border-bottom: 2px solid #313244;
    }

    .facility-image {
        width: 110px;
        height: 110px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Steyer Clicker </h1>
</header>

<div class="game">

    <!-- =========================
         UPGRADES
    ========================== -->

    <aside class="left-panel">

        <h2>Upgrade</h2>

        <div id="upgrades"></div>

    </aside>


    <!-- =========================
         MAIN CLICKER
    ========================== -->

    <main class="center-panel">

        <div class="stats">

            <div class="joules">
                <span id="joules">0</span> J
            </div>

            <div class="per-second">
                <span id="jps">0</span> J/sec
            </div>

        </div>

        <img
            id="clicker"
            src="Steyer.png"
            alt="Steyer"
        >

        <h2 class="facilities-title">
            Purchased Facilities
        </h2>

        <div id="facilities"></div>

    </main>


    <!-- =========================
         SKINS
    ========================== -->

    <aside class="right-panel">

        <h2>Skins</h2>

        <div id="skins"></div>

        <div class="leaderboard">

            <h2>Leaderboard</h2>

            <div id="leaderboard">
                Loading...
            </div>

            <button
                class="submit-button"
                onclick="submitScore()"
            >
                Submit Score
            </button>

        </div>

        <button
            class="reset-button"
            onclick="resetGame()"
        >
            Reset Game
        </button>

    </aside>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
    id="clickSound"
    src="click.m4a"
    preload="auto">
</audio>

<audio
    id="menuSound"
    src="menu.mp3"
    preload="auto">
</audio>

<audio
    id="menuClickSound"
    src="menuclick.mp3"
    preload="auto">
</audio>


<script>

/* =========================================================
   GAME STATE
========================================================= */

let gameState = {

    joules: 0,

    clickPower: 1,

    joulesPerSec: 0,

    selectedSkin: 0

};


/* =========================================================
   SKINS
========================================================= */

const skins = [

    {
        name: "Default Steyer",
        image: "Steyer.png",
        cost: 0,
        multiplier: 1
    },

    {
        name: "Sad Steyer",
        image: "SadSteyer.png",
        cost: 5000,
        multiplier: 2
    },

    {
        name: "Angy Steyer",
        image: "AngySteyer.png",
        cost: 250000,
        multiplier: 5
    },

    {
        name: "Juandice Steyer",
        image: "JuandiceSteyer.png",
        cost: 10000000,
        multiplier: 15
    },

    {
        name: "Green Steyer",
        image: "GreenSteyer.png",
        cost: 500000000,
        multiplier: 50
    }

];


/* =========================================================
   UPGRADES
========================================================= */

const upgrades = [

    {
        name: "Vernier Caliper",
        cost: 15,
        type: "click",
        power: 1,
        category: "Mechanics",
        img: "SteyerCaliper.jpg",
        count: 0
    },

    {
        name: "Graduate Lab Assistant",
        cost: 50,
        type: "auto",
        power: 1,
        category: "General Science",
        img: "SteyerAssistant.jpg",
        count: 0
    },

    {
        name: "Bunsen Burner",
        cost: 100,
        type: "click",
        power: 3,
        category: "Thermodynamics / Chem",
        img: "SteyerBurner.jpg",
        count: 0
    },

    {
        name: "Petri Dish Culture",
        cost: 250,
        type: "auto",
        power: 5,
        category: "Biology",
        img: "SteyerPetri.jpg",
        count: 0
    },

    {
        name: "Laser Interferometer",
        cost: 500,
        type: "click",
        power: 8,
        category: "Optics / Physics",
        img: "SteyerLaser.jpg",
        count: 0
    },

    {
        name: "Superconducting Magnet",
        cost: 2500,
        type: "auto",
        power: 15,
        category: "Electromagnetism",
        img: null,
        count: 0
    },

    {
        name: "Seismograph Network",
        cost: 10000,
        type: "auto",
        power: 40,
        category: "Geophysics",
        img: "SteyerSeismo.jpg",
        count: 0
    },

    {
        name: "DNA Sequencer Array",
        cost: 40000,
        type: "auto",
        power: 100,
        category: "Biophysics",
        img: "SteyerDNA.jpg",
        count: 0
    },

    {
        name: "Nuclear Fission Reactor",
        cost: 120000,
        type: "auto",
        power: 250,
        category: "Nuclear Physics",
        img: "SteyerReactor.jpg",
        count: 0
    },

    {
        name: "Particle Accelerator",
        cost: 800000,
        type: "auto",
        power: 1200,
        category: "Particle Physics",
        img: "SteyerParticle.jpg",
        count: 0
    },

    {
        name: "Quantum Computer Array",
        cost: 2000000,
        type: "auto",
        power: 2500,
        category: "Quantum Physics",
        img: "SteyerComputer.jpg",
        count: 0
    },

    {
        name: "Deep Space Radio Array",
        cost: 10000000,
        type: "auto",
        power: 8000,
        category: "Astrophysics",
        img: "SteyerRadio.jpg",
        count: 0
    },

    {
        name: "Dyson Swarm Collector",
        cost: 50000000,
        type: "auto",
        power: 25000,
        category: "Cosmology",
        img: "SteyerSwarm.jpg",
        count: 0
    }

];


/* =========================================================
   DOM ELEMENTS
========================================================= */

const joulesElement =
    document.getElementById("joules");

const jpsElement =
    document.getElementById("jps");

const clicker =
    document.getElementById("clicker");

const upgradesElement =
    document.getElementById("upgrades");

const facilitiesElement =
    document.getElementById("facilities");

const skinsElement =
    document.getElementById("skins");

const clickSound =
    document.getElementById("clickSound");

const menuSound =
    document.getElementById("menuSound");

const menuClickSound =
    document.getElementById("menuClickSound");


/* =========================================================
   AUDIO
========================================================= */

function playAudio(audio) {

    if (!audio) {
        return;
    }

    try {

        audio.pause();

        audio.currentTime = 0;

        const promise = audio.play();

        if (promise !== undefined) {
            promise.catch(() => {});
        }

    } catch (error) {

        console.log(
            "Audio error:",
            error
        );

    }

}


/* =========================================================
   STEYER CLICK
========================================================= */

clicker.addEventListener(
    "click",
    () => {

        const skin =
            skins[gameState.selectedSkin];

        const multiplier =
            skin
            ? skin.multiplier
            : 1;

        gameState.joules +=
            gameState.clickPower *
            multiplier;

        playAudio(clickSound);

        updateUI();

        saveGame();

    }
);


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(number) {

    if (number < 1000) {

        return Math.floor(number)
            .toLocaleString();

    }

    if (number < 1000000) {

        return (number / 1000)
            .toFixed(1) + "K";

    }

    if (number < 1000000000) {

        return (number / 1000000)
            .toFixed(1) + "M";

    }

    if (number < 1000000000000) {

        return (number / 1000000000)
            .toFixed(1) + "B";

    }

    if (number < 1000000000000000) {

        return (number / 1000000000000)
            .toFixed(1) + "T";

    }

    return number.toExponential(2);

}


/* =========================================================
   UNLOCK SYSTEM
========================================================= */

function isUpgradeUnlocked(index) {

    /*
       First upgrade is always visible.
    */

    if (index === 0) {
        return true;
    }

    /*
       Each upgrade unlocks after
       buying the previous upgrade.
    */

    return upgrades[index - 1].count > 0;

}


/* =========================================================
   UPGRADE SOUNDS
========================================================= */

function setupUpgradeSounds(
    element,
    index
) {

    /*
       menu.mp3 plays on hover.
    */

    element.addEventListener(
        "mouseenter",
        () => {

            playAudio(menuSound);

        }
    );


    /*
       Clicking attempts to purchase.
    */

    element.addEventListener(
        "click",
        () => {

            buyUpgrade(index);

        }
    );

}


/* =========================================================
   RENDER UPGRADES
========================================================= */

function renderUpgrades() {

    upgradesElement.innerHTML = "";


    upgrades.forEach(
        (item, index) => {

            /*
               Hide locked upgrades.
            */

            if (
                !isUpgradeUnlocked(index)
            ) {

                return;

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "upgrade";


            /*
               Grey out if unaffordable.
            */

            if (
                gameState.joules <
                item.cost
            ) {

                div.classList.add(
                    "cannot-afford"
                );

            }


            div.innerHTML = `

                <div class="upgrade-name">

                    ${item.name}

                    <span class="upgrade-count">
                        x${item.count}
                    </span>

                </div>

                <div class="upgrade-info">
                    ${item.category}
                </div>

                <div class="upgrade-info">

                    ${
                        item.type === "click"
                        ? "+" +
                          item.power +
                          " click power"
                        : "+" +
                          item.power +
                          " J/sec"
                    }

                </div>

                <div class="upgrade-cost">

                    Cost:
                    ${formatNumber(item.cost)}
                    J

                </div>

            `;


            setupUpgradeSounds(
                div,
                index
            );


            upgradesElement.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   BUY UPGRADE
========================================================= */

function buyUpgrade(index) {

    const item =
        upgrades[index];


    /*
       Locked upgrades cannot be bought.
    */

    if (
        !isUpgradeUnlocked(index)
    ) {

        return;

    }


    /*
       Can't afford it.
       No purchase sound.
    */

    if (
        gameState.joules <
        item.cost
    ) {

        return;

    }


    /*
       Pay for upgrade.
    */

    gameState.joules -=
        item.cost;


    /*
       Add one copy.
    */

    item.count++;


    /*
       Apply upgrade effect.
    */

    if (
        item.type === "click"
    ) {

        gameState.clickPower +=
            item.power;

    }


    if (
        item.type === "auto"
    ) {

        gameState.joulesPerSec +=
            item.power;

    }


    /*
       Increase cost.
    */

    item.cost =
        Math.ceil(
            item.cost * 1.45
        );


    /*
       Successful purchase sound.
    */

    playAudio(
        menuClickSound
    );


    renderUpgrades();

    renderFacilities();

    updateUI();

    saveGame();

}


/* =========================================================
   FACILITIES
========================================================= */

function renderFacilities() {

    facilitiesElement.innerHTML = "";


    upgrades.forEach(
        item => {

            if (
                item.count <= 0
            ) {

                return;

            }


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "facility-card";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "facility-info";


            info.innerHTML = `

                <div class="facility-name">
                    ${item.name} x${item.count}
                </div>

                <div class="facility-category">
                    ${item.category}
                </div>

                <div class="facility-production">

                    ${
                        item.type === "click"
                        ? "+" +
                          item.power +
                          " click power each"
                        : "+" +
                          item.power +
                          " J/sec each"
                    }

                </div>

            `;


            const imageContainer =
                document.createElement(
                    "div"
                );

            imageContainer.className =
                "facility-images";


            /*
               Make one large image
               for every purchase.
            */

            if (item.img) {

                for (
                    let i = 0;
                    i < item.count;
                    i++
                ) {

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.className =
                        "facility-image";

                    img.src =
                        item.img;

                    img.alt =
                        item.name +
                        " #" +
                        (i + 1);


                    img.onerror =
                        function() {

                            this.style.display =
                                "none";

                        };


                    imageContainer.appendChild(
                        img
                    );

                }

            } else {

                const noImage =
                    document.createElement(
                        "div"
                    );

                noImage.className =
                    "no-image";

                noImage.textContent =
                    "No image supplied";

                imageContainer.appendChild(
                    noImage
                );

            }


            card.appendChild(info);

            card.appendChild(
                imageContainer
            );

            facilitiesElement.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SKINS
========================================================= */

function renderSkins() {

    skinsElement.innerHTML = "";


    skins.forEach(
        (skin, index) => {

            /*
               Skin buttons intentionally
               contain NO images.
            */

            const button =
                document.createElement(
                    "div"
                );

            button.className =
                "skin";


            button.innerHTML = `

                <div class="skin-name">
                    ${skin.name}
                </div>

                <div class="skin-cost">

                    ${
                        skin.cost === 0
                        ? "Free"
                        : "Cost: " +
                          formatNumber(
                              skin.cost
                          ) +
                          " J"
                    }

                </div>

                <div class="skin-multiplier">

                    Click multiplier:
                    x${skin.multiplier}

                </div>

            `;


            button.addEventListener(
                "click",
                () => {

                    buySkin(index);

                }
            );


            skinsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   BUY SKIN
========================================================= */

function buySkin(index) {

    const skin =
        skins[index];


    if (
        gameState.joules <
        skin.cost
    ) {

        return;

    }


    gameState.joules -=
        skin.cost;


    gameState.selectedSkin =
        index;


    clicker.src =
        skin.image;


    playAudio(
        menuClickSound
    );


    updateUI();

    saveGame();

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    joulesElement.textContent =
        formatNumber(
            gameState.joules
        );

    jpsElement.textContent =
        formatNumber(
            gameState.joulesPerSec
        );


    /*
       Re-render upgrades so their
       greyed-out state stays current.
    */

    renderUpgrades();

}


/* =========================================================
   AUTO PRODUCTION
========================================================= */

setInterval(
    () => {

        if (
            gameState.joulesPerSec > 0
        ) {

            gameState.joules +=
                gameState.joulesPerSec;

            updateUI();

            saveGame();

        }

    },
    1000
);


/* =========================================================
   SAVE GAME
========================================================= */

function saveGame() {

    const saveData = {

        gameState: gameState,

        upgrades:
            upgrades.map(
                item => ({

                    count:
                        item.count,

                    cost:
                        item.cost

                })
            )

    };


    localStorage.setItem(
        "steyerClickerSave",
        JSON.stringify(saveData)
    );

}


/* =========================================================
   LOAD GAME
========================================================= */

function loadGame() {

    const saved =
        localStorage.getItem(
            "steyerClickerSave"
        );


    if (!saved) {

        return;

    }


    try {

        const data =
            JSON.parse(saved);


        if (
            data.gameState
        ) {

            gameState = {

                ...gameState,

                ...data.gameState

            };

        }


        if (
            data.upgrades
        ) {

            data.upgrades.forEach(
                (
                    savedUpgrade,
                    index
                ) => {

                    if (
                        upgrades[index]
                    ) {

                        upgrades[index].count =
                            savedUpgrade.count || 0;

                        upgrades[index].cost =
                            savedUpgrade.cost ||
                            upgrades[index].cost;

                    }

                }
            );

        }


        /*
           Recalculate all upgrade effects.
        */

        gameState.clickPower = 1;

        gameState.joulesPerSec = 0;


        upgrades.forEach(
            item => {

                if (
                    item.type === "click"
                ) {

                    gameState.clickPower +=
                        item.power *
                        item.count;

                }


                if (
                    item.type === "auto"
                ) {

                    gameState.joulesPerSec +=
                        item.power *
                        item.count;

                }

            }
        );


        /*
           Restore selected skin.
        */

        if (
            skins[
                gameState.selectedSkin
            ]
        ) {

            clicker.src =
                skins[
                    gameState.selectedSkin
                ].image;

        }

    } catch (error) {

        console.error(
            "Could not load save:",
            error
        );

    }

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    const confirmed =
        confirm(
            "Are you sure you want to reset Steyer Clicker?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "steyerClickerSave"
    );


    location.reload();

}


/* =========================================================
   DREAMLO LEADERBOARD
========================================================= */

const DREAMLO_PUBLIC_KEY =
    "6aa2cae78f40bb15a86e7234";


async function loadLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );


    try {

        const response =
            await fetch(
                `https://dreamlo.com/lb/${DREAMLO_PUBLIC_KEY}/json`
            );


        if (!response.ok) {

            throw new Error(
                "Leaderboard unavailable"
            );

        }


        const data =
            await response.json();


        leaderboard.innerHTML = "";


        let entries = [];


        if (
            data &&
            data.dreamlo &&
            data.dreamlo.leaderboard &&
            data.dreamlo.leaderboard.entry
        ) {

            entries =
                Array.isArray(
                    data.dreamlo.leaderboard.entry
                )
                ? data.dreamlo.leaderboard.entry
                : [
                    data.dreamlo.leaderboard.entry
                ];

        }


        entries
            .sort(
                (a, b) =>
                    Number(b.score) -
                    Number(a.score)
            )
            .slice(0, 10)
            .forEach(
                (entry, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "leaderboard-entry";


                    const name =
                        document.createElement(
                            "span"
                        );

                    name.textContent =
                        `${index + 1}. ${entry.name}`;


                    const score =
                        document.createElement(
                            "span"
                        );

                    score.textContent =
                        formatNumber(
                            Number(
                                entry.score
                            )
                        );


                    div.appendChild(name);

                    div.appendChild(score);

                    leaderboard.appendChild(
                        div
                    );

                }
            );


        if (
            entries.length === 0
        ) {

            leaderboard.textContent =
                "No scores yet.";

        }

    } catch (error) {

        leaderboard.textContent =
            "Leaderboard unavailable.";

    }

}


/* =========================================================
   SUBMIT SCORE
========================================================= */

async function submitScore() {

    const name =
        prompt(
            "Enter your name:"
        );


    if (!name) {

        return;

    }


    const safeName =
        encodeURIComponent(
            name.substring(
                0,
                20
            )
        );


    const score =
        Math.floor(
            gameState.joules
        );


    const url =
        `https://dreamlo.com/lb/${DREAMLO_PUBLIC_KEY}/add/${safeName}/${score}`;


    try {

        await fetch(url);


        alert(
            "Score submitted!"
        );


        loadLeaderboard();

    } catch (error) {

        alert(
            "Could not submit score."
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

loadGame();

renderUpgrades();

renderFacilities();

renderSkins();

updateUI();

loadLeaderboard();

</script>

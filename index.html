<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steyer Clicker </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    overflow-x: hidden;
}

header {
    background: #181825;
    padding: 15px 20px;
    text-align: center;
    border-bottom: 2px solid #313244;
}

header h1 {
    margin: 0;
    color: #cba6f7;
    font-size: 28px;
}

.game {
    display: grid;
    grid-template-columns: 300px 1fr 330px;
    min-height: calc(100vh - 70px);
}

/* =========================
   LEFT PANEL
========================= */

.left-panel {
    background: #181825;
    border-right: 2px solid #313244;
    padding: 15px;
    overflow-y: auto;
}

.left-panel h2,
.right-panel h2 {
    color: #f5c2e7;
    margin-top: 0;
}

/* =========================
   UPGRADES
========================= */

.upgrade {
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.15s;
}

.upgrade:hover {
    background: #45475a;
    transform: scale(1.02);
}

.upgrade:active {
    transform: scale(0.98);
}

.upgrade-name {
    font-weight: bold;
    color: #cba6f7;
    margin-bottom: 4px;
}

.upgrade-info {
    font-size: 13px;
    color: #a6adc8;
}

.upgrade-cost {
    margin-top: 5px;
    color: #a6e3a1;
    font-weight: bold;
}

.upgrade-count {
    float: right;
    color: #f9e2af;
    font-weight: bold;
}

/* =========================
   CANNOT AFFORD
========================= */

.upgrade.cannot-afford {
    background: #24242f;
    border-color: #383846;
    opacity: 0.5;
}

.upgrade.cannot-afford .upgrade-name {
    color: #77798a;
}

.upgrade.cannot-afford .upgrade-info {
    color: #5f6170;
}

.upgrade.cannot-afford .upgrade-cost {
    color: #77798a;
}

.upgrade.cannot-afford .upgrade-count {
    color: #696b7a;
}

.upgrade.cannot-afford:hover {
    background: #292936;
    transform: none;
}

/* =========================
   CENTER PANEL
========================= */

.center-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
}

.stats {
    width: 100%;
    max-width: 700px;
    background: #181825;
    border: 2px solid #313244;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
}

.joules {
    font-size: 30px;
    color: #f9e2af;
    font-weight: bold;
}

.per-second {
    color: #a6e3a1;
    margin-top: 5px;
}

#clicker {
    width: 250px;
    height: 250px;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s;
}

#clicker:active {
    transform: scale(0.92);
}

.facilities-title {
    margin-top: 25px;
    color: #f5c2e7;
}

/* =========================
   FACILITIES
========================= */

#facilities {
    width: 100%;
    max-width: 1100px;
}

.facility-card {
    background: #181825;
    border: 2px solid #313244;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    min-height: 155px;

    display: flex;
    align-items: center;
    gap: 20px;
}

.facility-info {
    flex: 0 0 190px;
    min-width: 190px;
}

.facility-name {
    font-size: 17px;
    font-weight: bold;
    color: #cba6f7;
}

.facility-category {
    font-size: 12px;
    color: #9399b2;
    margin-top: 5px;
}

.facility-production {
    font-size: 13px;
    color: #a6e3a1;
    margin-top: 7px;
}

.facility-images {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    flex: 1;
}

/* =========================
   BIG UPGRADE IMAGES
========================= */

.facility-image {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid #45475a;
    background: #313244;
    flex-shrink: 0;
    transition: transform 0.12s;
}

.facility-image:hover {
    transform: scale(1.05);
}

.no-image {
    color: #6c7086;
    font-size: 13px;
    font-style: italic;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel {
    background: #181825;
    border-left: 2px solid #313244;
    padding: 15px;
    overflow-y: auto;
}

/* =========================
   SKINS
========================= */

.skin {
    width: 100%;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.15s;
    text-align: left;
}

.skin:hover {
    background: #45475a;
    transform: scale(1.02);
}

.skin:active {
    transform: scale(0.98);
}

.skin-name {
    font-weight: bold;
    color: #cba6f7;
    font-size: 16px;
}

.skin-cost {
    color: #a6e3a1;
    font-size: 13px;
    margin-top: 5px;
}

.skin-multiplier {
    color: #a6adc8;
    font-size: 13px;
    margin-top: 3px;
}

/* =========================
   LEADERBOARD
========================= */

.leaderboard {
    margin-top: 25px;
}

.leaderboard-entry {
    background: #313244;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

button {
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    background: #cba6f7;
    color: #1e1e2e;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.auth-box {
    margin-top: 15px;
    padding: 12px;
    background: #24243a;
    border: 1px solid #45475a;
    border-radius: 10px;
}

.auth-box input {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 8px;
    border: 1px solid #45475a;
    border-radius: 7px;
    background: #313244;
    color: #cdd6f4;
    outline: none;
}

.auth-box input:focus {
    border-color: #cba6f7;
}

.auth-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.auth-status {
    font-size: 13px;
    color: #a6adc8;
    margin-bottom: 8px;
}

.auth-status.signed-in {
    color: #a6e3a1;
}

.auth-error {
    color: #f38ba8;
    font-size: 12px;
    margin-top: 8px;
}

.submit-button {
    margin-top: 8px;
}

.reset-button {
    margin-top: 20px;
    background: #f38ba8;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 1000px) {

    .game {
        grid-template-columns: 1fr;
    }

    .left-panel,
    .right-panel {
        border: none;
        border-bottom: 2px solid #313244;
    }

    .facility-image {
        width: 110px;
        height: 110px;
    }
}

        button:disabled, .upgrade.anti-cheat-disabled, .skin.anti-cheat-disabled {
            opacity: 0.45 !important;
            filter: grayscale(1);
            cursor: not-allowed !important;
        }

        #clicker.anti-cheat-disabled {
            opacity: 0.45;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .skin.anti-cheat-disabled {
            pointer-events: none;
        }

        .ban-status {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #3b2430;
            border: 1px solid #f38ba8;
            color: #f38ba8;
            font-size: 13px;
            line-height: 1.4;
        }
</style>

<header>

<div class="game">

    <!-- =========================

    <aside class="left-panel">

    <!-- =========================

    <main class="center-panel">

<audio

<audio

</audio>

<audio
    id="menuClickSound"
    src="menuclick.mp3"
    preload="auto">
</audio>


<script>

/* =========================================================
   GAME STATE
========================================================= */

let gameState = {

    joules: 0,

    clickPower: 1,

    joulesPerSec: 0,

    selectedSkin: 0

};


/* =========================================================
   SKINS
========================================================= */

const skins = [

    {

        image: "Steyer.png",

    },

    {

    }

];


/* =========================================================
   UPGRADES
========================================================= */

const upgrades = [

    {

    },

    {

        count: 0
    },

    {
        name: "DNA Sequencer Array",
        cost: 40000,
        type: "auto",
        power: 100,
        category: "Biophysics",
        img: "SteyerDNA.jpg",
        count: 0
    },

    {
        name: "Nuclear Fission Reactor",
        cost: 120000,
        type: "auto",
        power: 250,
        category: "Nuclear Physics",
        img: "SteyerReactor.jpg",
        count: 0
    },

    {
        name: "Particle Accelerator",
        cost: 800000,
        type: "auto",
        power: 1200,
        category: "Particle Physics",
        img: "SteyerParticle.jpg",
        count: 0
    },

    {
        name: "Quantum Computer Array",
        cost: 2000000,
        type: "auto",
        power: 2500,
        category: "Quantum Physics",
        img: "SteyerComputer.jpg",
        count: 0
    },

    {
        name: "Deep Space Radio Array",
        cost: 10000000,
        type: "auto",
        power: 8000,
        category: "Astrophysics",
        img: "SteyerRadio.jpg",
        count: 0
    },

    {
        name: "Dyson Swarm Collector",
        cost: 50000000,
        type: "auto",
        power: 25000,
        category: "Cosmology",
        img: "SteyerSwarm.jpg",
        count: 0
    }

];


/* =========================================================
   DOM ELEMENTS
========================================================= */

const joulesElement =
    document.getElementById("joules");

const jpsElement =
    document.getElementById("jps");

const clicker =
    document.getElementById("clicker");

const upgradesElement =
    document.getElementById("upgrades");

const facilitiesElement =
    document.getElementById("facilities");

const skinsElement =
    document.getElementById("skins");

const clickSound =
    document.getElementById("clickSound");

const menuSound =
    document.getElementById("menuSound");

const menuClickSound =
    document.getElementById("menuClickSound");


/* =========================================================
   AUDIO
========================================================= */

/* =========================================================
   RELIABLE AUDIO
========================================================= */

/*
   Sound effects use fresh Audio instances instead of repeatedly
   restarting one <audio> element. This prevents rapid clicks and
   overlapping menu sounds from cutting each other off.
*/

let audioUnlocked = false;

function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    audioUnlocked = true;

    [clickSound, menuSound, menuClickSound].forEach(audio => {

        if (!audio) {
            return;
        }

        try {
            audio.load();
        } catch (error) {
            console.log("Audio preload error:", error);
        }

    });

}

/*
   The first real user gesture unlocks audio in browsers that
   restrict autoplay. After that, hover sounds can play normally.
*/
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("keydown", unlockAudio, { once: true });

function playAudio(audio) {

    if (!audio) {
        return;
    }

    try {

        const sound = new Audio(audio.currentSrc || audio.src);
        sound.preload = "auto";
        sound.volume = audio.volume;

        sound.addEventListener(
            "ended",
            () => sound.remove(),
            { once: true }
        );

        const promise = sound.play();

        if (promise !== undefined) {
            promise.catch(error => {
                /*
                   Autoplay restrictions can block hover audio before
                   the first user interaction. Do not break the game.
                */
                console.log("Audio playback blocked:", error);
            });
        }

    } catch (error) {

        console.log(
            "Audio error:",
            error
        );

    }

}


/* =========================================================
   ANTI-CHEAT
========================================================= */

/*
   If more than 25 clicks are detected inside a rolling one-second
   window, the player is temporarily punished for one hour.

   This is a client-side anti-cheat check. It is useful against
   ordinary auto-clickers, but it cannot be made fully cheat-proof
   while the game logic runs in the player's browser.
*/

const ANTI_CHEAT_CPS_LIMIT = 25;
const ANTI_CHEAT_WINDOW_MS = 1000;
const ANTI_CHEAT_PUNISHMENT_MS = 60 * 60 * 1000;
const ANTI_CHEAT_STORAGE_KEY = "steyerAntiCheatPunishmentUntil";

let recentClicks = [];
let antiCheatPunishmentUntil = Number(
    localStorage.getItem(ANTI_CHEAT_STORAGE_KEY) || 0
);

/* Firebase is the source of truth for account bans. */
let firebaseBanUntil = 0;
let firebaseBanReason = "";
let firebaseBanListenerActive = false;

function isAntiCheatPunished() {
    const localPunished = antiCheatPunishmentUntil > Date.now();
    const firebasePunished = firebaseBanUntil > Date.now();

    if (!localPunished && antiCheatPunishmentUntil !== 0) {
        antiCheatPunishmentUntil = 0;
        localStorage.removeItem(ANTI_CHEAT_STORAGE_KEY);
    }

    return localPunished || firebasePunished;
}

function getPunishmentUntil() {
    return Math.max(
        antiCheatPunishmentUntil || 0,
        firebaseBanUntil || 0
    );
}

function applyAntiCheatLockState() {
    const punished = isAntiCheatPunished();

    document.querySelectorAll("button, .upgrade, .skin").forEach(element => {
        /* Keep account controls and Reset Game usable while banned. */
        const isAccountControl =
            element.id === "createAccountButton" ||
            element.id === "signInButton" ||
            element.id === "signOutButton";

        if (element.id === "resetGameButton" || isAccountControl) {
            element.classList.remove("anti-cheat-disabled");
            element.setAttribute("aria-disabled", "false");
            return;
        }

        element.disabled = punished;
        element.classList.toggle("anti-cheat-disabled", punished);
        element.setAttribute("aria-disabled", punished ? "true" : "false");
    });

    if (clicker) {
        clicker.classList.toggle("anti-cheat-disabled", punished);
        clicker.style.pointerEvents = punished ? "none" : "";
        clicker.setAttribute("aria-disabled", punished ? "true" : "false");
    }

    return punished;
}

function punishForSpeedClicking() {
    antiCheatPunishmentUntil =
        Date.now() + ANTI_CHEAT_PUNISHMENT_MS;

    localStorage.setItem(
        ANTI_CHEAT_STORAGE_KEY,
        String(antiCheatPunishmentUntil)
    );

    recentClicks = [];
    applyAntiCheatLockState();

    /* Ask the trusted Firebase backend to create the real ban. */
    if (window.triggerFirebaseAntiCheatBan) {
        window.triggerFirebaseAntiCheatBan().catch(error => {
            console.error("Could not create Firebase ban:", error);
        });
    }

    alert(
        "Anti-cheat triggered. Clicking too quickly was detected. " +
        "You cannot earn or submit scores for 1 hour."
    );
}

function registerClickForAntiCheat() {
    const now = Date.now();

    recentClicks.push(now);

    const cutoff = now - ANTI_CHEAT_WINDOW_MS;

    recentClicks = recentClicks.filter(
        timestamp => timestamp >= cutoff
    );

    if (recentClicks.length > ANTI_CHEAT_CPS_LIMIT) {
        punishForSpeedClicking();
        return false;
    }

    return true;
}

setInterval(() => {
    applyAntiCheatLockState();
}, 1000);

/* =========================================================
   STEYER CLICK
========================================================= */

clicker.addEventListener(
    "click",
    () => {

        if (applyAntiCheatLockState()) {
            return;
        }

        if (!registerClickForAntiCheat()) {
            return;
        }

        const skin =
            skins[gameState.selectedSkin];

        const multiplier =
            skin
            ? skin.multiplier
            : 1;

        gameState.joules +=
            gameState.clickPower *
            multiplier;

        playAudio(clickSound);

        updateUI();

        saveGame();

    }
);


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(number) {

    if (number < 1000) {

        return Math.floor(number)
            .toLocaleString();

    }

    if (number < 1000000) {

        return (number / 1000)
            .toFixed(1) + "K";

    }

    if (number < 1000000000) {

        return (number / 1000000)
            .toFixed(1) + "M";

    }

    if (number < 1000000000000) {

        return (number / 1000000000)
            .toFixed(1) + "B";

    }

    if (number < 1000000000000000) {

        return (number / 1000000000000)
            .toFixed(1) + "T";

    }

    return number.toExponential(2);

}


/* =========================================================
   UNLOCK SYSTEM
========================================================= */

function isUpgradeUnlocked(index) {

    /*
       First upgrade is always visible.
    */

    if (index === 0) {
        return true;
    }

    /*
       Each upgrade unlocks after
       buying the previous upgrade.
    */

    return upgrades[index - 1].count > 0;

}


/* =========================================================
   UPGRADE SOUNDS
========================================================= */

function setupUpgradeSounds(
    element,
    index
) {

    /*
       menu.mp3 plays on hover.
    */

    element.addEventListener(
        "mouseenter",
        () => {

            playAudio(menuSound);

        }
    );


    /*
       Clicking attempts to purchase.
    */

    element.addEventListener(
        "click",
        () => {

            buyUpgrade(index);

        }
    );

}


/* =========================================================
   RENDER UPGRADES
========================================================= */

function renderUpgrades() {

    upgradesElement.innerHTML = "";


    upgrades.forEach(
        (item, index) => {

            /*
               Hide locked upgrades.
            */

            if (
                !isUpgradeUnlocked(index)
            ) {

                return;

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "upgrade";


            /*
               Grey out if unaffordable.
            */

            if (
                gameState.joules <
                item.cost
            ) {

                div.classList.add(
                    "cannot-afford"
                );

            }


            div.innerHTML = `

                <div class="upgrade-name">

                    ${item.name}

                    <span class="upgrade-count">
                        x${item.count}
                    </span>

                </div>

                <div class="upgrade-info">
                    ${item.category}
                </div>

                <div class="upgrade-info">

                    ${
                        item.type === "click"
                        ? "+" +
                          item.power +
                          " click power"
                        : "+" +
                          item.power +
                          " J/sec"
                    }

                </div>

                <div class="upgrade-cost">

                    Cost:
                    ${formatNumber(item.cost)}
                    J

                </div>

            `;


            setupUpgradeSounds(
                div,
                index
            );


            upgradesElement.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   BUY UPGRADE
========================================================= */

function buyUpgrade(index) {

    const item =
        upgrades[index];


    /*
       Locked upgrades cannot be bought.
    */

    if (
        !isUpgradeUnlocked(index)
    ) {

        return;

    }


    /*
       Can't afford it.
       No purchase sound.
    */

    if (
        gameState.joules <
        item.cost
    ) {

        return;

    }


    /*
       Pay for upgrade.
    */

    gameState.joules -=
        item.cost;


    /*
       Add one copy.
    */

    item.count++;


    /*
       Apply upgrade effect.
    */

    if (
        item.type === "click"
    ) {

        gameState.clickPower +=
            item.power;

    }


    if (
        item.type === "auto"
    ) {

        gameState.joulesPerSec +=
            item.power;

    }


    /*
       Increase cost.
    */

    item.cost =
        Math.ceil(
            item.cost * 1.45
        );


    /*
       Successful purchase sound.
    */

    playAudio(
        menuClickSound
    );


    renderUpgrades();

    renderFacilities();

    updateUI();

    saveGame();

}


/* =========================================================
   FACILITIES
========================================================= */

function renderFacilities() {

    facilitiesElement.innerHTML = "";


    upgrades.forEach(
        item => {

            if (
                item.count <= 0
            ) {

                return;

            }


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "facility-card";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "facility-info";


            info.innerHTML = `

                <div class="facility-name">
                    ${item.name} x${item.count}
                </div>

                <div class="facility-category">
                    ${item.category}
                </div>

                <div class="facility-production">

                    ${
                        item.type === "click"
                        ? "+" +
                          item.power +
                          " click power each"
                        : "+" +
                          item.power +
                          " J/sec each"
                    }

                </div>

            `;


            const imageContainer =
                document.createElement(
                    "div"
                );

            imageContainer.className =
                "facility-images";


            /*
               Make one large image
               for every purchase.
            */

            if (item.img) {

                for (
                    let i = 0;
                    i < item.count;
                    i++
                ) {

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.className =
                        "facility-image";

                    img.src =
                        item.img;

                    img.alt =
                        item.name +
                        " #" +
                        (i + 1);


                    img.onerror =
                        function() {

                            this.style.display =
                                "none";

                        };


                    imageContainer.appendChild(
                        img
                    );

                }

            } else {

                const noImage =
                    document.createElement(
                        "div"
                    );

                noImage.className =
                    "no-image";

                noImage.textContent =
                    "No image supplied";

                imageContainer.appendChild(
                    noImage
                );

            }


            card.appendChild(info);

            card.appendChild(
                imageContainer
            );

            facilitiesElement.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SKINS
========================================================= */

function renderSkins() {

    skinsElement.innerHTML = "";


    skins.forEach(
        (skin, index) => {

            /*
               Skin buttons intentionally
               contain NO images.
            */

            const button =
                document.createElement(
                    "div"
                );

            button.className =
                "skin";


            button.innerHTML = `

                <div class="skin-name">
                    ${skin.name}
                </div>

                <div class="skin-cost">

                    ${
                        skin.cost === 0
                        ? "Free"
                        : "Cost: " +
                          formatNumber(
                              skin.cost
                          ) +
                          " J"
                    }

                </div>

                <div class="skin-multiplier">

                    Click multiplier:
                    x${skin.multiplier}

                </div>

            `;


            button.addEventListener(
                "click",
                () => {

                    buySkin(index);

                }
            );


            skinsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   BUY SKIN
========================================================= */

function buySkin(index) {

    const skin =
        skins[index];


    if (
        gameState.joules <
        skin.cost
    ) {

        return;

    }


    gameState.joules -=
        skin.cost;


    gameState.selectedSkin =
        index;


    clicker.src =
        skin.image;


    playAudio(
        menuClickSound
    );


    updateUI();

    saveGame();

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    joulesElement.textContent =
        formatNumber(
            gameState.joules
        );

    jpsElement.textContent =
        formatNumber(
            gameState.joulesPerSec
        );


    /*
       Re-render upgrades so their
       greyed-out state stays current.
    */

    renderUpgrades();

}


/* =========================================================
   AUTO PRODUCTION
========================================================= */

setInterval(
    () => {

        if (
            gameState.joulesPerSec > 0 &&
            !isAntiCheatPunished()
        ) {

            gameState.joules +=
                gameState.joulesPerSec;

            updateUI();

            saveGame();

        }

    },
    1000
);


/* =========================================================
   SAVE GAME
========================================================= */

function saveGame() {

    const saveData = {

        gameState: gameState,

        upgrades:
            upgrades.map(
                item => ({

                    count:
                        item.count,

                    cost:
                        item.cost

                })
            )

    };


    localStorage.setItem(
        "steyerClickerSave",
        JSON.stringify(saveData)
    );

}


/* =========================================================
   LOAD GAME
========================================================= */

function loadGame() {

    const saved =
        localStorage.getItem(
            "steyerClickerSave"
        );


    if (!saved) {

        return;

    }


    try {

        const data =
            JSON.parse(saved);


        if (
            data.gameState
        ) {

            gameState = {

                ...gameState,

                ...data.gameState

            };

        }


        if (
            data.upgrades
        ) {

            data.upgrades.forEach(
                (
                    savedUpgrade,
                    index
                ) => {

                    if (
                        upgrades[index]
                    ) {

                        upgrades[index].count =
                            savedUpgrade.count || 0;

                        upgrades[index].cost =
                            savedUpgrade.cost ||
                            upgrades[index].cost;

                    }

                }
            );

        }


        /*
           Recalculate all upgrade effects.
        */

        gameState.clickPower = 1;

        gameState.joulesPerSec = 0;


        upgrades.forEach(
            item => {

                if (
                    item.type === "click"
                ) {

                    gameState.clickPower +=
                        item.power *
                        item.count;

                }


                if (
                    item.type === "auto"
                ) {

                    gameState.joulesPerSec +=
                        item.power *
                        item.count;

                }

            }
        );


        /*
           Restore selected skin.
        */

        if (
            skins[
                gameState.selectedSkin
            ]
        ) {

            clicker.src =
                skins[
                    gameState.selectedSkin
                ].image;

        }

    } catch (error) {

        console.error(
            "Could not load save:",
            error
        );

    }

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    const confirmed =
        confirm(
            "Are you sure you want to reset Steyer Clicker?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "steyerClickerSave"
    );


    location.reload();

}


/* =========================================================
   FIREBASE LEADERBOARD
========================================================= */

const leaderboardElement =
    document.getElementById("leaderboard");


/*
   Firebase leaderboard functions are defined in the
   module script below.

   The module script exposes:
   - window.loadLeaderboard()
   - window.submitScore()
*/

/* =========================================================
   START GAME
========================================================= */

loadGame();

renderUpgrades();

renderFacilities();

renderSkins();

updateUI();
applyAntiCheatLockState();

</script>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        query,
        orderBy,
        limit,
        getDocs,
        doc,
        getDoc,
        setDoc,
        serverTimestamp,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    import {
        getFunctions,
        httpsCallable
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";


    /* =========================================================
       FIREBASE CONFIG
    ========================================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAh-ooeezdqj-XB3C6smhen4v0boVeW1FY",

        authDomain:
            "steyerclicker.firebaseapp.com",

        projectId:
            "steyerclicker",

        storageBucket:
            "steyerclicker.firebasestorage.app",

        messagingSenderId:
            "135359423456",

        appId:
            "1:135359423456:web:88a528c2a08cfccf268185",

        measurementId:
            "G-ZW6HJNY4JX"

    };


    /* =========================================================
       INITIALIZE FIREBASE / FIRESTORE
    ========================================================= */

    const app =
        initializeApp(firebaseConfig);

    const db =
        getFirestore(app);

    const auth =
        getAuth(app);

    const functions =
        getFunctions(app);


    /* =========================================================
       ACCOUNT ELEMENTS
    ========================================================= */

    const authStatus =
        document.getElementById("authStatus");

    const usernameInput =
        document.getElementById("usernameInput");

    const passwordInput =
        document.getElementById("passwordInput");

    const createAccountButton =
        document.getElementById("createAccountButton");

    const signInButton =
        document.getElementById("signInButton");

    const signOutButton =
        document.getElementById("signOutButton");

    const authError =
        document.getElementById("authError");


    /* =========================================================
       LEADERBOARD ELEMENT
    ========================================================= */

    const leaderboardElement =
        document.getElementById("leaderboard");

    const submitScoreButton =
        document.getElementById("submitScoreButton");


    /* =========================================================
       ACCOUNT / USERNAME HELPERS
    ========================================================= */

    const USERNAME_STORAGE_KEY =
        "steyerClickerLeaderboardUsername";

    function normalizeUsername(username) {

        return username
            .trim()
            .toLowerCase();

    }

    function usernameToDocumentId(username) {

        return encodeURIComponent(
            normalizeUsername(username)
        );

    }

    /*
       Firebase Authentication normally uses an email address.
       The player only sees a username; the game creates an
       internal Firebase email from that username so the player
       can sign in with username + password.
    */

    function usernameToAuthEmail(username) {

        return `${normalizeUsername(username)}@steyerclicker.firebaseapp.com`;

    }

    function validUsername(username) {

        return /^[A-Za-z0-9_-]{3,20}$/.test(username);

    }

    function clearAuthError() {

        authError.textContent = "";

    }

    function showAuthError(message) {

        authError.textContent = message;

    }

    function authErrorMessage(error) {

        switch (error.code) {

            case "auth/email-already-in-use":
                return "That username is already registered.";

            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                return "Incorrect username or password.";

            case "auth/weak-password":
                return "Password must be at least 6 characters.";

            case "auth/too-many-requests":
                return "Too many attempts. Please wait and try again.";

            case "auth/network-request-failed":
                return "Network error. Check your internet connection.";

            default:
                return error.message || "Account operation failed.";

        }

    }


    /* =========================================================
       AUTH STATE
    ========================================================= */

    onAuthStateChanged(auth, async (user) => {

        clearAuthError();

        if (!user) {

            watchFirebaseBan(null);
            authStatus.textContent = "Not signed in";
            authStatus.classList.remove("signed-in");
            usernameInput.disabled = false;
            passwordInput.disabled = false;
            createAccountButton.style.display = "inline-block";
            signInButton.style.display = "inline-block";
            signOutButton.style.display = "none";
            return;

        }

        try {

            const playerRef =
                doc(db, "leaderboard", user.uid);

            const playerSnapshot =
                await getDoc(playerRef);

            const data =
                playerSnapshot.exists()
                    ? playerSnapshot.data()
                    : null;

            const username =
                data?.username ||
                localStorage.getItem(USERNAME_STORAGE_KEY) ||
                "Player";

            usernameInput.value = username;
            passwordInput.value = "";

            localStorage.setItem(
                USERNAME_STORAGE_KEY,
                username
            );

            authStatus.textContent =
                `Signed in as ${username}`;

            authStatus.classList.add("signed-in");
            usernameInput.disabled = true;
            passwordInput.disabled = true;
            createAccountButton.style.display = "none";
            signInButton.style.display = "none";
            signOutButton.style.display = "inline-block";

        } catch (error) {

            console.error("Could not load account:", error);
            showAuthError("Signed in, but the player profile could not be loaded.");

        }

        await loadLeaderboard();

    });


    /* =========================================================
       CREATE ACCOUNT
    ========================================================= */

    async function createAccount() {

        clearAuthError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!validUsername(username)) {
            showAuthError("Username must be 3–20 characters using only letters, numbers, _ or -.");
            return;
        }

        if (password.length < 6) {
            showAuthError("Password must be at least 6 characters.");
            return;
        }

        const email = usernameToAuthEmail(username);

        try {

            createAccountButton.disabled = true;
            signInButton.disabled = true;

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            await setDoc(
                doc(db, "leaderboard", credential.user.uid),
                {
                    uid: credential.user.uid,
                    username: username,
                    score: Math.floor(Number(gameState.joules)) || 0,
                    updatedAt: serverTimestamp()
                }
            );

            localStorage.setItem(
                USERNAME_STORAGE_KEY,
                username
            );

            passwordInput.value = "";

            alert("Account created and signed in!");
            await loadLeaderboard();

        } catch (error) {

            console.error("Account creation error:", error);
            showAuthError(authErrorMessage(error));

            try {
                if (auth.currentUser) {
                    await signOut(auth);
                }
            } catch (_) {}

        } finally {

            createAccountButton.disabled = false;
            signInButton.disabled = false;

        }

    }


    /* =========================================================
       SIGN IN
    ========================================================= */

    async function signIn() {

        clearAuthError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!validUsername(username)) {
            showAuthError("Enter a valid username (3–20 letters, numbers, _ or -).");
            return;
        }

        if (!password) {
            showAuthError("Enter your password.");
            return;
        }

        try {

            createAccountButton.disabled = true;
            signInButton.disabled = true;

            await signInWithEmailAndPassword(
                auth,
                usernameToAuthEmail(username),
                password
            );

            localStorage.setItem(
                USERNAME_STORAGE_KEY,
                username
            );

            passwordInput.value = "";

        } catch (error) {

            console.error("Sign-in error:", error);
            showAuthError(authErrorMessage(error));

        } finally {

            createAccountButton.disabled = false;
            signInButton.disabled = false;

        }

    }


    /* =========================================================
       SIGN OUT
    ========================================================= */

    async function signOutPlayer() {

        clearAuthError();

        try {
            await signOut(auth);
        } catch (error) {
            console.error("Sign-out error:", error);
            showAuthError("Could not sign out.");
        }

    }


    createAccountButton.addEventListener(
        "click",
        createAccount
    );

    signInButton.addEventListener(
        "click",
        signIn
    );

    signOutButton.addEventListener(
        "click",
        signOutPlayer
    );


    /* =========================================================
       LOAD LEADERBOARD
    ========================================================= */

    async function loadLeaderboard() {

        leaderboardElement.textContent =
            "Loading...";

        try {

            const leaderboardQuery =
                query(
                    collection(
                        db,
                        "leaderboard"
                    ),
                    orderBy(
                        "score",
                        "desc"
                    ),
                    limit(10)
                );


            const snapshot =
                await getDocs(
                    leaderboardQuery
                );


            leaderboardElement.innerHTML = "";


            if (snapshot.empty) {

                leaderboardElement.textContent =
                    "No scores yet.";

                return;

            }


            snapshot.forEach(
                (documentSnapshot, index) => {

                    const data =
                        documentSnapshot.data();


                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "leaderboard-entry";


                    const name =
                        document.createElement(
                            "span"
                        );

                    name.textContent =
                        `${index + 1}. ${
                            data.username || "Unknown"
                        }`;


                    const score =
                        document.createElement(
                            "span"
                        );

                    score.textContent =
                        formatNumber(
                            Number(
                                data.score || 0
                            )
                        );


                    div.appendChild(name);

                    div.appendChild(score);

                    leaderboardElement.appendChild(
                        div
                    );

                }
            );

        } catch (error) {

            console.error(
                "Firebase leaderboard error:",
                error
            );

            leaderboardElement.textContent =
                "Leaderboard unavailable. Check your Firebase Firestore setup and rules.";

        }

    }


    /* =========================================================
       SUBMIT SCORE
    ========================================================= */

    async function submitScore() {

        if (isAntiCheatPunished()) {
            const remaining = Math.max(
                1,
                Math.ceil(
                    (getPunishmentUntil() - Date.now()) / 60000
                )
            );

            alert(
                `Anti-cheat punishment active. Please wait about ${remaining} minute${remaining === 1 ? "" : "s"} before submitting a score.`
            );
            return;
        }

        const user = auth.currentUser;

        if (!user) {
            alert("Please create an account or sign in before submitting your score.");
            return;
        }

        const currentScore =
            Math.floor(Number(gameState.joules));

        if (
            !Number.isFinite(currentScore) ||
            currentScore < 0
        ) {
            alert("Invalid score.");
            return;
        }

        try {

            const playerRef =
                doc(db, "leaderboard", user.uid);

            const existingSnapshot =
                await getDoc(playerRef);

            if (!existingSnapshot.exists()) {
                alert("Your account profile is missing. Please sign out and sign in again.");
                return;
            }

            const existingData =
                existingSnapshot.data();

            const existingScore =
                typeof existingData.score === "number"
                    ? existingData.score
                    : 0;

            if (currentScore > existingScore) {

                await setDoc(
                    playerRef,
                    {
                        uid: user.uid,
                        username: existingData.username,
                        score: currentScore,
                        updatedAt: serverTimestamp()
                    },
                    { merge: true }
                );

                alert("Score updated!");

            } else {

                alert("Your existing leaderboard score is higher, so it was kept.");

            }

            await loadLeaderboard();

        } catch (error) {

            console.error(
                "Firebase score submission error:",
                error
            );

            alert(
                "Could not update your score. Check your Firebase Authentication and Firestore rules."
            );

        }

    }


    /* =========================================================
       BUTTON
    ========================================================= */

    submitScoreButton.addEventListener(
        "click",
        submitScore
    );


    /*
       Expose these functions only in case other parts of
       the page need to call them.
    */

    window.loadLeaderboard =
        loadLeaderboard;

    window.submitScore =
        submitScore;


    /* =========================================================
       INITIAL LEADERBOARD LOAD
    ========================================================= */

    loadLeaderboard();

</script>
</body>
